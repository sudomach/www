<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position</title>
    <style>
      .relative {
        background-color: pink;
        width: 300px;
        height: 250px;
        position: relative;
      }
      .absolute {
        background-color: lightblue;
        width: 75px;
        height: 40px;
        position: absolute;
        top: 0;
        right: 0;
      }
    </style>
  </head>
  <body style="height: 3000px">
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
